<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Первый урок</h1>
    {% if post %}
    <h2>{{ post.title }}</h2>
    <p>{{post.content}}</p>
    <p>Оценка: {{post.rate}}</p>
    <p>{{post.created_at}}</p>
    {% else %}
    <h2>Постов пока нет!</h2>
    {% endif %}
</body>
</html>
